<!DOCTYPE html>
<html>
    <head>
        <title>3D Prints Orders</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/css/style.css">
    </head>
    <body>
        <div class="container">
            <h1>Ollie's Custom 3D Prints Orders</h1>

            <h2 id="ordersCountDisplay">No Orders Yet!</h2>

            <div id="ordersContainer" class="orders-container"></div>
            <div id="ordersActionButtons" class="ordersActionButtons">
                <button id="ordersHomeButton" type="button" class="orders-home-button secondary-button" aria-label="Home" title="Home">
                    <img src="/images/menuIcons/home.svg" class="orders-home-image" alt="">
                </button>
                <button id="ordersRefreshButton" class="orders-refresh-button secondary-button" aria-label="Refresh orders" title="Refresh">
                    <img src="/images/menuIcons/refresh.svg" id="ordersRefreshImage" class="orders-refresh-image" alt="Refresh">
                </button>
                <button id="ordersLogoutButton" class="orders-logout-button danger-button" aria-label="Log out" title="Log Out">
                    <img src="/images/menuIcons/logout.svg" id="ordersLogoutImage" class="orders-logout-image" alt="logout">
                </button>
            </div>
        </div>

        <script src="/js/network.js"></script>
        <script src="/js/footer.js"></script>
        <script src="/js/orders.js"></script>
    </body>
</html>
