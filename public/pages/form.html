<!DOCTYPE html>
<html>
    <head>
        <title>3D Print Orders</title>
        <link rel="stylesheet" href="/css/style.css">
    </head>
    <body>    
        <div class="container">
            <h1>Ollie's Custom 3D Prints</h1>

            <form id="orderForm">
        
                <div class="form-section">
                    <h2>Your Information</h2>
            
                    <div class="form-row">
                         <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" placeholder="First Name" class="first-name" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" placeholder="Last Name" class="last-name" required>
                        </div>
                    </div>

                    <div class="form-group">                            
                        <label for="contact">Contact (Phone or Email)</label>
                        <input type="text" id="contact" placeholder="(123) 456-7890 or email@example.com" class="contact">
                    </div>

                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" placeholder="Any additional notes about your order..." class="notes"></textarea>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Choose from our existing prints</h2>
                    <div id="existingItemsContainer">
                    </div>
                    <div id="existingItemsTotalPriceContainer" class="total-price" style="display: none;">
                        <strong>Total for Existing Prints: $<span id="existingItemsTotalPriceText">0.00</span></strong>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Choose your own print</h2>
                    <div id="customItemsContainer">
                    </div>
                </div>

                <button type="submit" class="primary-btn">Submit Order</button>

            </form>

            <div class="success" id="successMessageContainer" style="display: none">Successfully Submitted Your Order!</div>

        </div>

        <script src="/js/custom-selects.js"></script>
        <script type="module" src="/js/form.js"></script>
    </body>
</html>
