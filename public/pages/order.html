<!DOCTYPE html>
<html>
    <head>
        <title>3D Print Order</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/css/style.css">
    </head>
    <body>
        <div class="container">
            <h1 id="orderTitle">Loading Order...</h1>

            <div id="orderError" class="error" role="alert"></div>

            <div class="form-section">
                <h2>Order Information</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input id="firstName" type="text" placeholder="First Name" readonly required>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input id="lastName" type="text" placeholder="Last Name" readonly required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="contact">Contact (Phone Or Email)</label>
                    <input id="contact" type="text" placeholder="(123) 456-7890 or email@example.com" readonly>
                </div>

                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" placeholder="Any additional notes about your order..." class="notes" readonly></textarea>
                </div>
            </div>

            <div class="form-section">
                <h2>Existing Prints</h2>
                <div id="existingItemsContainer"></div>
                <div id="existingItemsTotalPriceContainer" class="total-price order-total-price">
                    <strong>Total for Existing Prints: $<span id="existingItemsTotalPriceText">0.00</span></strong>
                </div>
                <button id="addExistingItemButton" type="button" class="primary-button order-add-item-button" hidden>
                    Add Existing Print
                </button>
            </div>

            <div class="form-section">
                <h2>Custom Prints</h2>
                <div id="customItemsContainer"></div>
                <button id="addCustomItemButton" type="button" class="primary-button order-add-item-button" hidden>
                    Add Custom Print
                </button>
            </div>

            <div id="orderActionButtons" class="order-action-buttons">
                <button id="orderModeButton" type="button" class="secondary-button order-action-button" aria-label="Edit order" title="Edit">
                    <img id="orderModeImage" src="/images/menuIcons/pencil.svg" alt="">
                </button>
                <button id="orderSaveButton" type="button" class="primary-button order-action-button" aria-label="Save order" title="Save" hidden>
                    <img src="/images/menuIcons/save.svg" alt="">
                </button>
                <button id="orderBackButton" type="button" class="secondary-button order-action-button" aria-label="Back to orders" title="Back">
                    <img src="/images/menuIcons/arrow-right.svg" alt="">
                </button>
                <button id="orderFinishButton" type="button" class="primary-button order-action-button" aria-label="Finish order" title="Complete">
                    <img src="/images/menuIcons/check.svg" alt="">
                </button>
            </div>
        </div>

        <script src="/js/custom-selects.js"></script>
        <script src="/js/network.js"></script>
        <script src="/js/footer.js"></script>
        <script src="/js/order.js"></script>
    </body>
</html>
