<!DOCTYPE html>
<html>
    <head>
        <title>3D Print Order</title>
        <link rel="stylesheet" href="/css/style.css">
    </head>
    <body>
        <div class="container">
            <h1>Viewing Ollie's Custom 3D Prints Order</h1>

            <div>
                <div>
                    <div class="form-section">
                        <h2>Order Information</h2>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName">First Name</label>
                                <input id="firstName" type="text" placeholder="First Name" readonly>
                            </div>

                            <div class="form-group">
                                <label for="lastName">Last Name</label>
                                <input id="lastName" type="text" placeholder="Last Name" readonly>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="contact">Contact (Phone Or Email)</label>
                            <input id="contact" type="text" placeholder="(123) 456-7890 or email@example.com" readonly>
                        </div>

                        <div class="form-group">
                            <label for="notes">Notes</label>
                            <textarea id="notes" placeholder="Any additional notes about your order..." class="notes"></textarea>
                        </div>
                    </div>

                    <div class="form-section">
                        <h2>Existing Prints</h2>
                    </div>

                    <div class="form-section">
                        <h2>Custom Prints</h2>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
