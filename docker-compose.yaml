services:
  printshop:
    build: .
    image: osharpsand/printshop-app:latest

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      - PORT=3000
      - PRODUCTION=true
      - DOMAIN=printshop.example.com
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin

    volumes:
      - type: bind
        source: ./config/.env
        target: /app/config/.env
        bind:
          create_host_path: false
      - type: bind
        source: ./config/credentials.json
        target: /app/config/credentials.json
        bind:
          create_host_path: false
      - ./orders:/app/orders
      - ./archive:/app/archive
      - ./sessions:/app/sessions